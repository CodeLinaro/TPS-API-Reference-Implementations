[advisories]
version = 2
# Report unmaintained packages that are workspace-direct dependencies.
unmaintained = "workspace"
yanked = "warn"

[licenses]
# Files in this workspace are MIT licensed. A dependency licence is allowed only if it imposes no obligation

allow = [
    "MIT",
    "Unicode-3.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "ISC",
    "Zlib",
]


# Code generated by cbindgen is not covered by MPL
[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "cbindgen"